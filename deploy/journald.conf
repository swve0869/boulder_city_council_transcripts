# Installed as /etc/systemd/journald.conf.d/50-council.conf by scripts/setup_pi.sh.
# Caps the system journal so it doesn't grow to its default (10% of the disk, up to 4 GB),
# which mostly means less wear on the Pi's SD card. Applies to every service, not just ours.
[Journal]
SystemMaxUse=500M
MaxRetentionSec=3month
