<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Summary</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="meeting">
<main>
<nav class="top"><a id="back" href="index.html">&larr; All meetings</a><a href="trends.html">Trends</a></nav>
<h1 id="title">Loading…</h1>
<p id="meta" class="meta"></p>
<div id="meeting-tags" hidden>
  <div class="tags" id="meeting-tag-list" aria-label="Tags in this meeting (most discussed first). Select one to highlight its topics."></div>
  <p class="tag-note" id="tag-note"></p>
</div>
<p class="note">Summary generated by <span id="model">an AI model</span> from YouTube captions.
Check the video before quoting. Not an official city record.</p>
<div class="player"><div class="frame"><div id="player"></div></div></div>
<p id="status" class="status"></p>
<div id="topics"></div>
<section id="transcript-section" hidden>
  <h2>Full transcript</h2>
  <button id="load-transcript" class="load" type="button">Load full transcript</button>
  <div id="transcript" class="transcript" hidden></div>
</section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
