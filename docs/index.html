<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Council Summaries</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
<main>
<nav class="top"><a href="index.html" aria-current="page">Meetings</a><a href="trends.html">Trends</a><a href="issue.html">Issues</a></nav>
<h1>City Council Meeting Summaries</h1>
<p class="note">Summaries and tags are generated by AI models from YouTube captions, which are mostly auto-generated.
Names, numbers and terms can be wrong; check the video before quoting. This is not an official city record.</p>
<p id="city-picker" hidden><label>City: <select id="city"></select></label></p>

<section class="filters" aria-label="Filter meetings">
  <div class="row">
    <input id="q" type="search" placeholder="Search titles and summaries" aria-label="Search meeting titles, topic titles and summaries">
    <label>Sort <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="relevance">Most time on selected tags</option>
      <option value="topics">Most topics</option>
    </select></label>
    <label>Match <select id="match">
      <option value="any">any selected tag</option>
      <option value="all">all selected tags</option>
    </select></label>
  </div>
  <details id="tag-panel">
    <summary id="tag-summary">Filter by tag</summary>
    <div id="tag-groups"></div>
  </details>
  <p id="active" class="active" hidden></p>
</section>

<p id="status" class="status">Loading…</p>
<div id="list"></div>
</main>
<div id="tooltip" class="tooltip" role="tooltip"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
