# Summarizer configuration, read by summarize.py (and the watcher via summarize.py).
#
# Layout:
#   [summarize]        which models to use and general settings
#   [prompts.<name>]   prompt texts; {format} is replaced by summary_prompt_JSON_format.json
#   [providers.<name>] API endpoints and where their keys come from
#   [models.<name>]    a provider + model ID + per-model options
#
# API keys never go in this file: each provider names an environment variable
# (set it in .env, which scripts/cron_watch.sh loads).

[summarize]
# Models to try, in order. The first one to return a valid summary wins; if a model
# errors, refuses, or keeps returning invalid JSON, the next one is tried.
# Override on the command line: python summarize.py --model deepseek ...
models = ["haiku"]

# JSON shape the prompt asks for and the validator checks.
format_file = "summary_prompt_JSON_format.json"

# Controlled tag vocabulary; {tags} in a prompt is replaced by its id: description list.
tags_file = "tags.json"
max_topics = 30             # topic cap in the structured-output schema (40 exceeds the API's
                            # grammar size limit with 38 tags; meetings so far have <= 13)

# Where validated summaries are written (served by GitHub Pages).
output_dir = "docs/summaries"

# Default per-model settings; any [models.*] entry can override these.
prompt = "default"
max_attempts = 3            # tries per model before moving to the next one
transcript_format = "json"  # "json": the transcript file as compact JSON (what the prompt describes)
                            # "lines": one "<start>\t<text>" line per segment, roughly 30% fewer tokens
max_input_chars = 0         # skip a model if the transcript is longer than this (0 = no limit);
                            # use it for small-context models instead of silently truncating
timeout_seconds = 900
structured_output = true    # anthropic only: constrain replies to a JSON schema built from the
                            # format + tag list (valid JSON and valid tags guaranteed)

# Summaries are only saved if they pass the structure check. These relax or tighten it.
[summarize.validation]
max_summary_sentences = 5        # longer summaries produce a warning
exact_timestamps_required = false  # true: every timestamp must equal a transcript "start" value


# ---- Prompts --------------------------------------------------------------------------

[prompts.default]
# Optional system prompt (leave empty for none).
system = ""
text = """summarize this city council transcript into this JSON format {format} \
where related_timestamps are "start" fields from the JSON transcript where the topic begins and ends. \
Summary sections should not be longer than 5 sentences. \
Tag each topic with the 1 to 3 tags from the list below that best describe it, most specific first \
(an empty list only for procedural items such as roll call or adjournment), and set the meeting's \
Tags to the 3 to 6 tags that best describe the meeting overall. Use only these tags:
{tags}
DO NOT return anything else but the JSON formatted text"""

# Example of a second prompt a model can opt into with prompt = "detailed".
[prompts.detailed]
system = "You summarize local government meetings for residents. Be neutral and specific: name motions, votes, dollar amounts and who spoke for which side."
text = """summarize this city council transcript into this JSON format {format} \
where related_timestamps are "start" fields from the JSON transcript where the topic begins and ends. \
Include every agenda item and public hearing as its own topic. \
Summary sections should not be longer than 5 sentences. \
Tag each topic with every tag from the list below that applies, and set the meeting's Tags to the tags \
of its main topics. Use only these tags:
{tags}
DO NOT return anything else but the JSON formatted text"""


# ---- Providers --------------------------------------------------------------------------
# type = "anthropic"  -> Anthropic SDK (pip install anthropic)
# type = "openai"     -> OpenAI SDK (pip install openai); also any OpenAI-compatible API via base_url

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
type = "openai"
api_key_env = "OPENAI_API_KEY"

[providers.deepseek]
type = "openai"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[providers.gemini]
type = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[providers.openrouter]
type = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.ollama]
# Local models; no key needed.
type = "openai"
base_url = "http://localhost:11434/v1"
api_key_env = ""


# ---- Models -----------------------------------------------------------------------------
# provider     one of [providers.*]
# model        the provider's model ID (check the provider's model list; IDs change)
# label        name shown on the website ("Summary generated by <label>")
# json_mode    openai-type only: ask the API for a JSON object response
# prompt_cache anthropic only: cache the transcript so retries are cheaper
# structured_output anthropic only: schema-constrained JSON (default true; see [summarize])
# fallbacks    anthropic only: "default" lets the API retry a refused request on another model
# params       extra arguments passed straight to the API call (temperature, effort, etc.)
# price        optional $ per million tokens, for the cost estimate in logs: { input, output } plus
#              long_threshold / long_input / long_output when large prompts are billed at a higher rate
# Any [summarize] default (prompt, max_attempts, transcript_format, max_input_chars,
# timeout_seconds) can be set per model too.

[models.claude]
provider = "anthropic"
model = "claude-sonnet-5-5"
label = "Claude Sonnet 5.5"
max_tokens = 64000
prompt_cache = true
fallbacks = "default"
# params = { output_config = { effort = "medium" } }
price = { input = 2.00, output = 10.00 }

[models.haiku]
provider = "anthropic"
model = "claude-haiku-5-5"
label = "Claude Haiku 5.5"
max_tokens = 64000
prompt_cache = true
# No `fallbacks`: Haiku has no server-side refusal fallback. To fall back on a
# refusal, list another model after it in [summarize] models, e.g. ["haiku", "claude"].
price = { input = 0.10, output = 0.50, long_threshold = 100000, long_input = 0.50, long_output = 2.50 }

[models.claude-opus]
provider = "anthropic"
model = "claude-opus-5-5"
label = "Claude Opus 5.5"
max_tokens = 64000
prompt_cache = true
fallbacks = "default"
price = { input = 4.00, output = 20.00 }

[models.gpt]
provider = "openai"
model = "gpt-5"
label = "OpenAI GPT-5"
json_mode = true
params = { max_completion_tokens = 32000 }

[models.deepseek]
provider = "deepseek"
model = "deepseek-chat"
label = "DeepSeek"
json_mode = true
transcript_format = "lines"   # long meetings exceed its context as full JSON
max_input_chars = 350000
params = { max_tokens = 8192 }

[models.gemini]
provider = "gemini"
model = "gemini-2.5-pro"
label = "Gemini 2.5 Pro"
json_mode = true

[models.local]
provider = "ollama"
model = "llama3.1:70b"
label = "Llama 3.1 70B (local)"
json_mode = true
transcript_format = "lines"
timeout_seconds = 3600


# ---- Site -------------------------------------------------------------------------------
# Used by build_site.py for the Atom feed (docs/feed.xml), which needs absolute links.

[site]
url = "https://swve0869.github.io/boulder_city_council_transcripts/"
title = "City Council Meeting Summaries"
feed_entries = 40           # newest meetings to include in the feed
