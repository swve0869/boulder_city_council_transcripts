# Runs on every push (including the watcher's automatic summary commits) and pull request.
# No secrets, network access or third-party packages needed.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Published summaries match the format
        run: python summarize.py --check docs/summaries/*/*.json
      - name: Site files are up to date (run `python build_site.py` and commit if this fails)
        run: |
          python build_site.py
          git diff --exit-code -- docs/
      - name: Site scripts parse
        run: for f in docs/*.js; do node --check "$f"; done
